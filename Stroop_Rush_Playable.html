<script id="core">
'use strict';
window.StroopCore=(()=>{
const COLOURS=[{name:'RED',hex:'#c53747'},{name:'GREEN',hex:'#247c55'},{name:'BLUE',hex:'#3265c5'},{name:'YELLOW',hex:'#b08316'}];
const TASKS={colour:{name:'Colour City',short:'Follow the ink',rule:'Choose the ink colour. Ignore what the word says.',icon:'colour'},arrows:{name:'Highway Arrows',short:'Follow the direction',rule:'Choose where the arrow points. Ignore where the sign stands.',icon:'arrow'},number:{name:'Number Toll',short:'Follow the count',rule:'Count the symbols. Ignore the value of the printed digit.',icon:'number'}};
const CONDITIONS=['congruent','incongruent','neutral'];
const ORDERS=[['colour','arrows','number'],['colour','number','arrows'],['arrows','colour','number'],['arrows','number','colour'],['number','colour','arrows'],['number','arrows','colour']];
function rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rand){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeTrial(task,condition,target,rand){let distractor=null,cue='',ink=null,position=null;const n=task==='arrows'?2:4;if(condition==='congruent')distractor=target;else if(condition==='incongruent')distractor=(target+1+Math.floor(rand()*(n-1)))%n;
if(task==='colour'){ink=COLOURS[target].hex;cue=condition==='neutral'?'XXXX':COLOURS[distractor].name}
if(task==='number')cue=Array(target+1).fill(condition==='neutral'?'#':String(distractor+1)).join(' ');
if(task==='arrows'){cue=target===0?'left':'right';position=condition==='neutral'?'centre':(distractor===0?'left':'right')}
return {task,condition,target,distractor,cue,ink,position,jitter:500+Math.floor(rand()*301)}}
function generate(task,seed){if(!TASKS[task])throw new Error('Unknown task');const rand=rng(seed),n=task==='arrows'?2:4;const a=[];for(const c of CONDITIONS)for(let i=0;i<16;i++)a.push(makeTrial(task,c,i%n,rand));for(let tries=0;tries<1000;tries++){const b=shuffle(a,rand);if(!b.some((t,i)=>i>=3&&[1,2,3].every(j=>b[i-j].condition===t.condition)))return b.map((t,i)=>({...t,trial:i+1}));}throw new Error('Unable to generate trial order')}
function practice(task,seed){const rand=rng(seed);return shuffle(['congruent','congruent','congruent','incongruent','incongruent','incongruent','neutral','neutral'],rand).map((c,i)=>({...makeTrial(task,c,i%(task==='arrows'?2:4),rand),trial:i+1}))}
function warmup(seed,task='colour'){const rand=rng(seed);return [0,1,2,3].map((t,i)=>({...makeTrial(task,'neutral',t,rand),trial:i+1}))}
function median(a){if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y),m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2}
function classify(t,choice,rt,deadline=2000,interrupt=false){if(interrupt)return {correct:false,error:'interrupted',validRT:false};if(choice===null||rt>deadline)return {correct:false,error:'timeout',validRT:false};if(rt<150)return {correct:false,error:'anticipation',validRT:false};const correct=choice===t.target;return {correct,error:correct?'none':t.condition==='incongruent'&&choice===t.distractor?'conflict-consistent':'wrong-choice',validRT:correct}}
function summary(records,task){const all=records.filter(x=>x.task===task&&x.stage==='assessment');const usable=all.filter(x=>x.error!=='interrupted');const by={};for(const c of CONDITIONS){const rows=usable.filter(x=>x.condition===c&&x.correct&&x.validRT&&Number.isFinite(x.rt)&&x.rt>=150&&x.rt<=2000);by[c]={n:rows.length,rt:median(rows.map(x=>x.rt))}}const sufficient=CONDITIONS.every(c=>by[c].n>=8);const correct=usable.filter(x=>x.correct).length;return {task,total:all.length,denominator:usable.length,correct,accuracy:usable.length?correct/usable.length:null,by,sufficient,cost:sufficient?by.incongruent.rt-by.congruent.rt:null,interference:sufficient?by.incongruent.rt-by.neutral.rt:null,facilitation:sufficient?by.neutral.rt-by.congruent.rt:null,errors:{wrong:usable.filter(x=>x.error==='wrong-choice').length,conflict:usable.filter(x=>x.error==='conflict-consistent').length,anticipation:usable.filter(x=>x.error==='anticipation').length,timeout:usable.filter(x=>x.error==='timeout').length,interrupted:all.filter(x=>x.error==='interrupted').length}}}
function adapt(tier,records,enabled=true){if(!enabled)return {tier,reason:'Adaptation is off'};if(records.some(x=>x.error==='interrupted'))return {tier,reason:'Interrupted round; tier held'};const c=records.filter(x=>x.correct).length;if(c>=7)return {tier:Math.min(8,tier+1),reason:tier===8?'Top tier held':'7 or more correct; one tier up'};if(c<=5)return {tier:Math.max(1,tier-1),reason:tier===1?'First tier held':'5 or fewer correct; one tier down'};return {tier,reason:'6 correct; tier held'}}
function windowMs(tier){return 2400-(Math.max(1,Math.min(8,tier))-1)*150}
function csv(session){const cols=['session_code','protocol','seed','input_device','language','task_order','stage','task','trial','condition','cue','ink','position','correct_response_index0','distractor_index0','response_index0','input','onset_ms','response_ms','rt_ms','correct','error','valid_rt','deadline_ms','tier','practice_attempt'];const esc=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const rows=session.records.map(t=>[session.code,session.protocol,session.seed,session.device,session.profile?.language,session.order.join(' > '),t.stage,t.task,t.trial,t.condition,t.cue,t.ink,t.position,t.target,t.distractor,t.choice,t.input,t.onset,t.responseTime,t.rt,t.correct,t.error,t.validRT,t.deadline,t.tier,t.attempt]);return [cols,...rows].map(r=>r.map(esc).join(',')).join('\r\n')}

<script id="game">

function icon(name,size=24){const paths={arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',back:'<path d="m14 5-7 7 7 7M7 12h14"/>',pause:'<path d="M8 5v14M16 5v14"/>',play:'<path d="m8 5 11 7-11 7Z"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="currentColor"/><circle cx="15" cy="17" r="3" fill="currentColor"/>',ticket:'<path d="M3 5h18v5a2 2 0 0 0 0 4v5H3v-5a2 2 0 0 0 0-4Z"/><path d="M15 5v14" stroke-dasharray="2 3"/>',check:'<path d="m5 12 5 5L20 6"/>',colour:'<circle cx="9" cy="9" r="5"/><circle cx="16" cy="15" r="5"/>',number:'<path d="M8 3 5 21M17 3l-3 18M3 9h18M2 16h18"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',map:'<path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Zm6-2v16m6-14v16"/>',flag:'<path d="M5 21V4m0 0c5-5 8 5 14 0v10c-6 5-9-5-14 0"/>',sound:'<path d="M3 9h4l5-5v16l-5-5H3ZM16 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/>',close:'<path d="m5 5 14 14M19 5 5 19"/>'};return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.arrow}</svg>`}

function show(name,markup,{back='home',game=false}={}){screen=name;document.body.classList.toggle('reduced',prefs.reduced);app.className=game?'app game-app':'app';app.dataset.screen=name;app.innerHTML=game?markup:header(back)+markup;art=null;cancelAnimationFrame(artFrame);if(!game){window.scrollTo({top:0,behavior:'instant'});const heading=app.querySelector('h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true})}}}

modal.addEventListener('cancel',e=>{if(run&&run.paused)e.preventDefault()});
function sound(ok=true,complete=false){if(prefs.haptic&&navigator.vibrate)navigator.vibrate(ok?18:[24,35,24]);if(!prefs.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const notes=complete?[523,659,784]:[ok?620:180];notes.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain(),start=audio.currentTime+i*.09;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(.06,start+.012);g.gain.exponentialRampToValueAtTime(.001,start+.13);o.connect(g);g.connect(audio.destination);o.start(start);o.stop(start+.14)})}catch{}}
function savePrefs(){safe.set(PREF_KEY,prefs);document.body.classList.toggle('reduced',prefs.reduced)}
function settings(){openModal('Make it comfortable',`<p>These preferences apply to this device.</p><div class="stack mt"><label class="toggle"><input type="checkbox" id="pref-sound" ${prefs.sound?'checked':''}>Sound after each answer</label><label class="toggle"><input type="checkbox" id="pref-haptic" ${prefs.haptic?'checked':''}>Haptic feedback, if available</label><label class="toggle"><input type="checkbox" id="pref-reduced" ${prefs.reduced?'checked':''}>Reduce decorative motion</label></div>${btn('Done','close-modal','mt')}`)}
function home(){cancelTimers();run=null;show('home',`<div class="eyebrow">The attention adventure</div><h1 class="hero-title">STROOP<span>RUSH.</span></h1><p class="hero-caption">Catch the right cue.<br>Keep your mind on track.</p><div class="hero-scene"><canvas id="hero-canvas" aria-label="An illustrated runner travelling through three playful districts" role="img"></canvas><div class="hero-tag">THREE<br>DISTRICTS.<br>ONE YOU.</div></div><div class="home-actions"><button class="modecard" data-action="consent"><span class="modeicon">${icon('ticket',27)}</span><span><b>Take the assessment</b><small>3 districts · 144 gates · about 15 min</small></span><span class="go">↗</span></button><button class="modecard secondary" data-action="free-hub"><span class="modeicon">${icon('play',25)}</span><span><b>Jump into Free Play</b><small>Fast runs. Difficulty that adapts.</small></span><span class="go">↗</span></button></div><div class="subnav"><button class="textbtn" data-action="about">How it works</button><button class="textbtn" data-action="saved">Saved runs</button></div><p class="footer-note">A Group 6 experiment in attention.<br>Works offline. Your data stays on your device.</p>`);mountArt('hero-canvas','hero')}
function about(){openModal('Follow the right cue',`<ul class="checklist"><li><span><b>Colour City:</b> match the ink, not the word.</span></li><li><span><b>Highway Arrows:</b> follow the arrow, not its position.</span></li><li><span><b>Number Toll:</b> count the symbols, ignore the digit.</span></li></ul><p>Assessment uses a fixed 2-second response window, balanced trial types and separate results for each task. Free Play adjusts between eight-gate rounds.</p><p class="mt-sm">This is an experimental class game. Results describe this run, not your intelligence or a diagnosis. Browser and device timing can vary.</p><p class="mt-sm">Keyboard: D F J K for four lanes, F J for arrows. Escape pauses. On phones, tap the large pads.</p>${btn('Got it','close-modal','mt')}`)}
function consent(){cancelTimers();run=null;session=newSession();show('consent',`<div class="steps"><i class="on"></i><i></i><i></i></div><div class="eyebrow">Before your run</div><h1 class="title">Your choice<br>comes first.</h1><p class="lead">A visual attention game for our class project. Stop whenever you need, without penalty.</p><div class="panel"><p>We record your choices, response times and device information under a random session code. This HTML file sends nothing to a server. Names, email, audio and video are not collected.</p><div class="mt-sm"><label class="checkrow"><input type="checkbox" id="adult"><span>I am 18 or older.</span></label><label class="checkrow"><input type="checkbox" id="consent"><span>I agree to take part in the assessment.</span></label><label class="checkrow"><input type="checkbox" id="retain"><span>Save my finished run on this device.<small>Optional and off by default. You can export or delete it later. Otherwise, it stays in memory until you leave.</small></span></label></div></div>${hadPractice?'<div class="alert">You have already practised in this visit. This assessment will be marked as practice-exposed in its export.</div>':''}<p id="consent-error" class="error" role="status"></p>${btn('Continue '+icon('arrow',19),'consent-next','mt-sm')}<button class="textbtn" data-action="free-hub">Skip assessment and play freely</button>`,{back:'home-route'})}
function setup(){show('setup',`<div class="steps"><i class="on"></i><i class="on"></i><i></i></div><div class="eyebrow">A quick setup</div><h1 class="title">Ready for<br>the route?</h1><p class="lead">Sit comfortably and give yourself a quiet moment.</p><div class="stack mt"><label class="field">Task language<select id="language"><option>English</option></select></label><p class="hint">This version uses English colour words. Assessment assumes you read these fluently.</p><label class="field">Hand you use most · optional<select id="hand"><option value="">Prefer not to say</option><option>Right</option><option>Left</option><option>Both</option></select></label><label class="field">Sleep last night · optional<input id="sleep" type="number" min="0" max="24" step="0.5" inputmode="decimal" placeholder="Hours"></label></div><div class="panel"><h3>Can you distinguish these?</h3><div class="swatches">${COLOURS.map(c=>`<span style="background:${c.hex}" aria-label="${c.name.toLowerCase()}"></span>`).join('')}</div><div class="choice-row" role="group" aria-label="Can you distinguish the four task colours?"><button class="choice" data-colour="yes" aria-pressed="false">Yes</button><button class="choice" data-colour="no" aria-pressed="false">No</button><button class="choice" data-colour="unsure" aria-pressed="false">Unsure</button></div><p class="hint mt-sm">If not, Colour City will be skipped. You can still try the other two tasks.</p></div><p id="setup-error" class="error" role="status"></p>${btn('Learn the controls '+icon('arrow',19),'setup-next','mt-sm')}`,{back:'consent'})}
function warmupIntro(){show('warmup-intro',`<div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div><div class="eyebrow">Four easy gates</div><h1 class="title">Get a feel<br>for the controls.</h1><div class="route-preview"><div class="district-icon">${icon('ticket',100)}</div></div><p class="lead">${colourAccess==='yes'?'Tap the pad that matches the ink colour.':'Count the symbols, then tap that numbered pad.'} Any lane is one tap away.</p><ul class="checklist"><li>Use the fixed pads at the bottom.</li><li>Try to be quick and accurate.</li><li>A mistake never ends your run.</li></ul><p class="hint">These gates are unscored. On a keyboard, use D F J K from left to right.</p>${btn('Try the controls','warmup-start','mt')}`,{back:'setup'})}
function currentTask(){return session.order[taskPos]}
function tutorial(task,free=false){demoPassed=false;const t=TASKS[task];let cue='',desc='',pads='';if(task==='colour'){cue='<span style="color:#3265c5">GREEN</span>';desc='The ink is blue. Tap the third pad, or press J.';pads=COLOURS.map((c,i)=>`<button class="demo-pad" style="background:${c.hex};color:${i===3?'#182e32':'white'}" data-demo="${i}" aria-label="${c.name.toLowerCase()} lane">${['D','F','J','K'][i]}</button>`).join('')}else if(task==='arrows'){cue=icon('arrow',65);desc='The arrow points right. Tap RIGHT, or press J.';pads=['LEFT','RIGHT'].map((x,i)=>`<button class="demo-pad" data-demo="${i}">${x}</button>`).join('')}else{cue='2 2 2';desc='There are three symbols. Tap 3, or press J.';pads=[1,2,3,4].map((x,i)=>`<button class="demo-pad" data-demo="${i}">${x}</button>`).join('')}
show('tutorial',`<div class="eyebrow">${free?'Free Play briefing':'Your next district'}</div><h1 class="title">${t.name}</h1><p class="lead">${t.rule}</p><div class="rule-card"><span class="pill">Try this example</span><div class="example-cue ${task==='number'?'number':''}" ${task==='arrows'?'style="justify-content:flex-start;padding-left:20px"':''}>${cue}</div><p class="hint">${desc}</p><div class="demo-pads mt">${pads}</div><p class="tutorial-answer" id="demo-answer" role="status">Tap the correct answer to continue.</p></div><p class="hint mt">${free?'Eight-gate rounds. Unscored and adjustable.':'Next: eight practice gates. Get at least seven right to begin the scored run. You get a second try if needed.'}</p>${btn(free?'Start my round':'Start practice','tutorial-next','mt','disabled id="tutorial-next"')}`,{back:free?'free-hub':'assessment-exit'});app.dataset.task=task;app.dataset.free=String(free)}
function demo(choice){const task=app.dataset.task,target=task==='arrows'?1:2;app.querySelectorAll('[data-demo]').forEach(e=>e.dataset.hit=String(Number(e.dataset.demo)===choice));if(choice===target){demoPassed=true;document.getElementById('demo-answer').textContent='That’s it. You followed the right cue.';document.getElementById('tutorial-next').disabled=false;sound(true)}else{document.getElementById('demo-answer').textContent='Give it another try. '+(task==='colour'?'Choose blue ink.':task==='arrows'?'Follow the arrow to the right.':'Count the three symbols.');sound(false)}}
function inputPads(task){const n=task==='arrows'?2:4;return Array.from({length:n},(_,i)=>{const colour=task==='colour',label=colour?COLOURS[i].name.toLowerCase()+' lane':task==='arrows'?(i?'right':'left')+' lane':'lane '+(i+1),key=task==='arrows'?['F','J'][i]:['D','F','J','K'][i];return `<button class="response-pad ${colour?'colour':''}" data-response="${i}" style="background:${colour?COLOURS[i].hex:'var(--card)'};color:${colour&&i!==3?'white':'var(--ink)'}" aria-label="${label}, key ${key}">${colour?`<span>${key}</span>`:`<span>${task==='arrows'?(i?'RIGHT':'LEFT'):i+1}</span><span class="key">${key}</span>`}</button>`}).join('')}
function renderGame(){const task=run.task,t=TASKS[task],stage=run.stage;show('game',`<header class="topbar"><div class="game-heading"><div class="eyebrow">${stage==='assessment'?'Assessment':stage==='warmup'?'Control check':stage==='practice'?'Practice only':'Free Play'}</div><h1>${t.name}<span class="practice-count" id="practice-count"></span></h1></div><button class="iconbtn" data-action="pause" aria-label="Pause game">${icon('pause',22)}</button></header><div class="game-progress" role="progressbar" aria-label="District progress" aria-valuemin="0" aria-valuemax="${run.items.length}" aria-valuenow="0"><div id="game-progress"></div></div><div class="world"><canvas id="game-canvas" aria-hidden="true"></canvas><div class="stimulus" id="stimulus" aria-hidden="true"></div><div class="phase-message" id="phase-message"><b>Get ready</b><small>${t.short}</small></div><span class="stage-pill" id="stage-pill">${stage==='assessment'?'Follow the cue':stage==='free'?'Tier '+tier:'Unscored'}</span><div class="deadline-line"><i id="deadline"></i></div></div><div class="response-area"><div class="response-pads">${inputPads(task)}</div><p class="game-help">${task==='colour'?'Match the ink colour':task==='arrows'?'Follow the arrow direction':'Count the symbols'} · tap a pad</p></div>`,{game:true});mountArt('game-canvas',task);updateProgress()}
function startRun(stage,task,items){hadPractice=true;cancelTimers();run={stage,task,items,index:0,records:[],phase:'gap',paused:false,active:false,current:null,onset:null,deadline:stage==='free'?C.windowMs(tier):2000};visualLane=null;flash='';renderGame();nextTrial()}
function updateProgress(){if(!run)return;const prog=document.getElementById('game-progress'),count=document.getElementById('practice-count');if(prog)prog.style.width=100*run.index/run.items.length+'%';const bar=app.querySelector('[role=progressbar]');if(bar)bar.setAttribute('aria-valuenow',run.index);if(count)count.textContent=run.stage==='assessment'?'':`${Math.min(run.index+1,run.items.length)} / ${run.items.length}`}
function phase(name,title,sub=''){if(!run)return;run.phase=name;app.dataset.phase=name;const cue=document.getElementById('stimulus'),msg=document.getElementById('phase-message');if(cue)cue.style.visibility=name==='stimulus'?'visible':'hidden';if(msg){msg.hidden=name==='stimulus';msg.innerHTML=`<b>${title}</b>${sub?`<small>${sub}</small>`:''}`}}
function nextTrial(){if(!run||run.paused)return;if(run.index>=run.items.length){finishRun();return}run.current={...run.items[run.index]};if(run.stage==='free')run.current.jitter=220+(run.current.jitter%181);run.gateBorn=performance.now();run.active=false;visualLane=null;flash='';phase('gap','<span class="ready-dot"></span>');updateProgress();document.getElementById('deadline').style.transform='scaleX(1)';app.querySelectorAll('.response-pad').forEach(b=>b.classList.remove('selected'));const thisRun=run;after(run.current.jitter,()=>{if(run!==thisRun||run.paused)return;prepareCue(run.current);const g=generation;requestAnimationFrame(()=>{if(g!==generation||run!==thisRun||run.paused)return;phase('stimulus','');run.onset=performance.now();run.active=true;after(run.deadline,()=>{if(run?.active)answer(null,'timeout')})})})}
function prepareCue(t){const el=document.getElementById('stimulus');el.className='stimulus'+(t.task==='arrows'?' arrow':t.task==='number'?' number':'');el.style.color=t.ink||'#182e32';el.style.left=t.task==='arrows'?({left:'23%',right:'77%',centre:'50%'}[t.position]):'50%';el.innerHTML=t.task==='arrows'?`<span style="width:100%;display:flex;justify-content:center;${t.target===0?'transform:scaleX(-1)':''}">${icon('arrow',64)}</span>`:esc(t.cue)}
function answer(choice,input,interrupted=false){if(!run||(!run.active&&!interrupted))return;const now=performance.now(),t=run.current,rt=interrupted||choice===null?null:Math.round((now-run.onset)*1000)/1000;run.active=false;run.exitDepth=gateDepth(now);cancelTimers();const verdict=C.classify(t,choice,rt??(run.deadline+1),run.deadline,interrupted);const rec={...t,stage:run.stage,choice:verdict.error==='timeout'?null:choice,input,onset:Math.round(run.onset*1000)/1000,responseTime:interrupted||choice===null?null:Math.round(now*1000)/1000,rt:verdict.error==='timeout'?null:rt,...verdict,deadline:run.deadline,tier:run.stage==='free'?tier:null,attempt:run.stage==='practice'?practiceAttempt:null};run.records.push(rec);session.records.push(rec);run.index++;feedbackStart=performance.now();visualLane=choice;flash=verdict.correct?'correct':'wrong';if(interrupted){phase('paused','Paused');return}let title=verdict.correct?'Nice catch!':verdict.error==='timeout'?'Next one’s yours':verdict.error==='anticipation'?'Wait for the cue':'Keep going';phase('feedback',title);document.getElementById('deadline').style.transform='scaleX(0)';if(choice!==null){const pad=app.querySelector(`[data-response="${choice}"]`);if(pad)pad.classList.add('selected')}sound(verdict.correct);updateProgress();after(300,nextTrial)}
function finishRun(){const completed=run;run=null;cancelTimers();if(completed.stage==='warmup'){taskPos=0;practiceAttempt=1;nextDistrict();return}if(completed.stage==='practice'){const correct=completed.records.filter(x=>x.correct).length;show('practice-result',`<div class="eyebrow">${TASKS[completed.task].name} · practice</div><div class="stamp">${icon(correct>=7?'check':'flag',40)}</div><h1 class="title center">${correct>=7?'You’ve got the rule.':'Let’s settle in.'}</h1><div class="stats"><div class="stat"><b>${correct} / 8</b><span>Correct practice gates</span></div><div class="stat"><b>7 / 8</b><span>Needed to begin assessment</span></div></div><p class="lead">${correct>=7?'Your practice is complete. The next 48 gates use fixed timing. Be as quick and accurate as you can.':practiceAttempt===1?'No rush. Read the rule once more, then take a second practice round.':'We’ll leave this district unscored. You can continue with the remaining tasks.'}</p>${btn(correct>=7?'Start scored run':practiceAttempt===1?'Review and try again':'Continue to next district',correct>=7?'assessment-start':practiceAttempt===1?'practice-retry':'practice-skip','mt')}`,{back:'assessment-exit'});return}
if(completed.stage==='assessment'){session.taskStatus[completed.task]='completed';districtDone(completed.task);return}
freeRoundRecords=completed.records;const correct=completed.records.filter(x=>x.correct).length,previous=tier,next=C.adapt(tier,completed.records,adaptive);tier=next.tier;lastRound={task:completed.task,round:freeRound,correct,previous,next:tier,reason:next.reason,median:C.median(completed.records.filter(x=>x.correct&&x.rt>=150).map(x=>x.rt))};session.events.push({type:'adaptation',...lastRound,at:new Date().toISOString()});freeCheckpoint()}
function nextDistrict(){if(taskPos>=session.order.length){finishAssessment();return}const task=currentTask();if(task==='colour'&&colourAccess!=='yes'){session.taskStatus.colour='skipped-colour-access';taskPos++;nextDistrict();return}practiceAttempt=1;tutorial(task)}
function startPractice(){const task=currentTask();startRun('practice',task,C.practice(task,session.seed+taskPos*1009+practiceAttempt*113))}
function assessmentStart(){const task=currentTask();session.taskStatus[task]='in-progress';startRun('assessment',task,C.generate(task,session.seed+taskPos*1009))}
function districtDone(task){sound(true,true);const s=C.summary(session.records,task);show('district-done',`<div class="eyebrow">District complete</div><div class="stamp">${icon('check',40)}</div><h1 class="title center">${TASKS[task].name}<br>in the bag.</h1><p class="lead center">One more stop on your attention adventure.</p><div class="panel">${session.order.map((t,i)=>`<div class="route-row"><span class="route-dot">${i<=taskPos?icon('check',18):icon(TASKS[t].icon,18)}</span><div><b>${TASKS[t].name}</b><p>${session.taskStatus[t]==='completed'?'Complete':session.taskStatus[t]?.startsWith('skipped')?'Not scored':'Still to come'}</p></div></div>`).join('')}</div>${btn(taskPos<session.order.length-1?'Take a station break':'See my results','district-next','mt')}`,{back:'assessment-exit'})}
function stationBreak(){breakStarted=performance.now();breakEnd=breakStarted+30000;fatigue=null;show('break',`<div class="eyebrow">A station break</div><h1 class="title center">A little room<br>to breathe.</h1><div class="break-graphic"><svg viewBox="0 0 175 175" aria-hidden="true"><circle cx="87.5" cy="87.5" r="78"/><circle class="fill" id="rest-ring" cx="87.5" cy="87.5" r="78"/></svg><b id="rest-time">0:30</b></div><p class="hint center">Look away and rest your eyes.<br>Take longer if you need.</p><div class="panel"><h3>How tired do you feel?</h3><div class="choice-row mt-sm" role="group" aria-label="Tiredness from 1 not tired to 5 very tired">${[1,2,3,4,5].map(x=>`<button class="choice" data-fatigue="${x}" aria-label="${x}${x===1?' not tired':x===5?' very tired':''}" aria-pressed="false">${x}</button>`).join('')}</div><div class="row between mt-sm"><span class="hint">1 · Not tired</span><span class="hint">5 · Very tired</span></div></div>${btn('Resting…','break-next','mt','disabled id="rest-next"')}<p class="hint center mt-sm" id="rest-hint">Minimum rest is 30 seconds. Rating is optional.</p>`,{back:'assessment-exit'});tickBreak()}
function tickBreak(){if(screen!=='break')return;const left=Math.max(0,Math.ceil((breakEnd-performance.now())/1000));document.getElementById('rest-time').textContent='0:'+String(left).padStart(2,'0');document.getElementById('rest-ring').style.strokeDashoffset=490*(1-left/30);if(!left){const b=document.getElementById('rest-next');b.disabled=false;b.textContent='Continue when ready';document.getElementById('rest-hint').textContent='Ready whenever you are.'}else after(250,tickBreak)}
function finishAssessment(early=false){cancelTimers();run=null;session.ended=new Date().toISOString();session.status=early?'ended-early':Object.values(session.taskStatus).some(x=>x?.startsWith('skipped'))?'completed-with-skips':'completed';results()}
function resultCard(task){const s=C.summary(session.records,task),status=session.taskStatus[task];const cost=s.sufficient?`${Math.round(s.cost)} <small style="font-size:14px">ms</small>`:'—';return `<article class="result-card"><div class="result-top"><h3>${TASKS[task].name}</h3><span class="result-chip">${status==='completed'?'Complete':s.total?'Partial':'Not scored'}</span></div><div class="result-summary"><span class="hint">Congruency cost</span><b>${cost}</b></div><p class="hint mt-sm">${s.denominator?`${s.correct} / ${s.denominator} correct · ${Math.round(s.accuracy*100)}% accuracy`:'No scored responses'}${s.total<48&&s.total?' · '+s.total+' of 48 gates presented':''}</p>${!s.sufficient?'<p class="hint mt-sm">Not enough usable correct responses in each condition for a cost estimate.</p>':''}<details><summary>Response times and quality notes</summary><table class="result-table"><thead><tr><th>Condition</th><th>Valid correct</th><th>Median RT</th></tr></thead><tbody>${CONDITIONS.map(c=>`<tr><td>${c[0].toUpperCase()+c.slice(1)}</td><td>${s.by[c].n}</td><td>${s.by[c].rt===null?'—':Math.round(s.by[c].rt)+' ms'}</td></tr>`).join('')}</tbody></table><p class="hint">${s.sufficient?`Interference vs neutral: ${Math.round(s.interference)} ms. Facilitation: ${Math.round(s.facilitation)} ms. `:''}Wrong choices: ${s.errors.wrong}. Conflict-consistent errors: ${s.errors.conflict}. Anticipations: ${s.errors.anticipation}. Timeouts: ${s.errors.timeout}. Interrupted: ${s.errors.interrupted}.</p>${status?.startsWith('skipped')?`<p class="hint mt-sm">${status==='skipped-colour-access'?'Skipped because the task colours could not be distinguished.':'Skipped after the second practice attempt.'}</p>`:''}</details></article>`}
function results(){const rows=session.records.filter(x=>x.stage==='assessment'&&x.error!=='interrupted'),correct=rows.filter(x=>x.correct).length;show('results',`<div class="eyebrow">${session.status==='ended-early'?'Run ended':'Your route is complete'}</div><h1 class="title">Every cue<br>tells a story.</h1><p class="lead">Here’s what happened in this session. Each district is a different task.</p><div class="stats"><div class="stat"><b>${rows.length?Math.round(correct/rows.length*100)+'%':'—'}</b><span>Overall accuracy · ${correct}/${rows.length}</span></div><div class="stat"><b>${session.records.filter(x=>x.stage==='assessment').length}</b><span>Scored gates presented</span></div></div>${session.order.map(resultCard).join('')}<div class="panel"><h3>What does the cost mean?</h3><p>Congruency cost is the median response time on conflicting gates minus matching gates. It describes the difference during this run. Accuracy matters alongside speed.</p><p class="hint mt-sm">An estimate needs at least eight valid correct responses in each condition. Negative values can occur. These results are experimental, not a diagnosis or a ranking of your attention.</p>${session.practiceExposed?'<p class="hint mt-sm">This run is marked practice-exposed.</p>':''}</div><div class="panel"><h3>Keep your results?</h3><label class="checkrow"><input id="save-run" type="checkbox" ${session.storeChoice?'checked':''}><span>Save this run on this device.<small>Nothing is uploaded. Uncheck to remove its saved copy.</small></span></label><p class="hint mt-sm">Session ${esc(session.code)}. Reports can be downloaded either way.</p><div class="downloads mt"><button class="btn small secondary" data-action="download-csv">${icon('download',16)} Trial CSV</button><button class="btn small secondary" data-action="download-json">JSON</button><button class="btn small secondary" data-action="download-report">Report</button></div></div>${btn('Explore Free Play '+icon('play',18),'free-hub','mt')}${btn('Back to the station','home-route','ghost mt-sm')}<p class="footer-note">On phones, your browser may show a preview instead of downloading.<br>Use Share or Save to keep the file.</p>`,{back:'home-route'});if(session.storeChoice)persistRun(true)}
function persistRun(keep){if(!session)return;const old=safe.get(SAVE_KEY,[]),list=old.filter(x=>x.code!==session.code);if(keep)list.unshift(JSON.parse(JSON.stringify(session)));if(!safe.set(SAVE_KEY,list.slice(0,10)))toast('Device storage is unavailable. Download your report to keep it.');else if(keep)toast('Run saved on this device.');else toast('Saved copy removed. This run is still open.')}
function freeHub(){cancelTimers();run=null;show('free-hub',`<div class="eyebrow">Free Play · unscored</div><h1 class="title">Pick a district.<br>Find your flow.</h1><p class="lead">Eight fast gates. A proper sprint. Find the cue as the city rushes past.</p>${Object.entries(TASKS).map(([k,t])=>`<button class="routelink" data-free-task="${k}"><span class="roundicon">${icon(t.icon,28)}</span><h3>${t.name}</h3><p class="hint">${t.short}. ${k==='colour'?'Four colourful lanes.':k==='arrows'?'A fork in the track.':'A little counting twist.'}</p></button>`).join('')}<div class="panel"><label class="toggle"><input id="adaptive" type="checkbox" ${adaptive?'checked':''}><span>Adaptive difficulty<small class="hint" style="display:block">Changes between rounds. Turn off for a fixed pace.</small></span></label></div><p class="footer-note">Practice results are separate from assessment.<br>It’s always okay to pause.</p>`,{back:'home-route'})}
function startFree(task){session=newSession('free');freeTask=task;freeRound=1;tier=5;tutorial(task,true)}
function freeStartRound(){const set=C.generate(freeTask,session.seed+Math.floor((freeRound-1)/6)*8191),offset=((freeRound-1)%6)*8;startRun('free',freeTask,set.slice(offset,offset+8).map((t,i)=>({...t,trial:(freeRound-1)*8+i+1})))}
function freeCheckpoint(){const r=lastRound,coach=r.correct>=7?'You’re finding the cue. Keep that rhythm.':r.correct>=5?'A little space to settle in. You’ve got time.':'Let the cue arrive, then choose. A fresh round is waiting.';show('free-checkpoint',`<div class="eyebrow">Free Play · round ${r.round} complete</div><div class="stamp">${icon(r.correct>=7?'ticket':'flag',40)}</div><h1 class="title center">${r.correct>=7?'Right on track.':'Keep finding your flow.'}</h1><div class="stats"><div class="stat"><b>${r.correct} / 8</b><span>Correct gates</span></div><div class="stat"><b>${r.median===null?'—':Math.round(r.median)+' ms'}</b><span>Median correct response</span></div></div><div class="panel"><div class="row between"><b>Next round · tier ${tier} of 8</b><span class="pill">${C.windowMs(tier)/1000} s</span></div><p class="hint mt-sm">${esc(r.reason)}. ${adaptive?'The response window is set before the next round.':'Your difficulty stays fixed.'}</p></div><p class="coach">${coach}</p>${btn('Another round '+icon('arrow',19),'free-continue')}${btn('Choose another district','free-hub','secondary mt')}${btn('Back to the station','home-route','ghost mt-sm')}`,{back:'free-hub'})}
function pause(reason='manual'){if(!run||run.paused)return;const wasActive=run.active;run.frozenDepth=gateDepth(performance.now());cancelTimers();if(wasActive)answer(null,'interrupted',true);run.paused=true;run.active=false;phase('paused','Take your time');session.events.push({type:'pause',reason,stage:run.stage,at:new Date().toISOString()});openModal('A quick breather.',`<p>${wasActive?'The active gate was marked interrupted and won’t be replayed or included in your reaction time.':'Your next gate will wait for you.'}</p>${btn('Resume the route','resume','mt')}${btn(run.stage==='free'?'End this practice':'End assessment','end-run','secondary')}`)}
function resume(){if(!run)return;closeModal();run.paused=false;session.events.push({type:'resume',at:new Date().toISOString()});nextTrial()}
function endRun(){cancelTimers();closeModal();if(session?.mode==='assessment'){if(run?.task)session.taskStatus[run.task]='ended-early';finishAssessment(true)}else{run=null;freeHub()}}
function assessmentExit(){if(run){pause();return}openModal('Leave this assessment?',`<p>You can view or export the responses recorded so far. No remaining gate will be filled in.</p>${btn('Keep going','close-modal','mt')}${btn('End and view partial results','end-run','secondary')}`)}
function download(name,type,content){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Your file is ready. Check downloads or the browser’s share menu.')}
function report(s){return ['STROOP RUSH — RUN REPORT','Experimental class game. Not a diagnosis.','Session: '+s.code,'Protocol: '+s.protocol,'Started: '+s.started,'Status: '+s.status,'Device: '+s.device,'Practice exposed: '+s.practiceExposed,'Task order: '+s.order.map(t=>TASKS[t].name).join(' > '),'',...s.order.flatMap(t=>{const r=C.summary(s.records,t);return [TASKS[t].name,`Accuracy: ${r.correct}/${r.denominator}${r.accuracy===null?'':' ('+Math.round(r.accuracy*100)+'%)'}`,`Congruency cost: ${r.cost===null?'not enough usable trials':Math.round(r.cost)+' ms'}`,...CONDITIONS.map(c=>`${c}: median ${r.by[c].rt===null?'unavailable':Math.round(r.by[c].rt)+' ms'}, n=${r.by[c].n}`),`Errors: ${JSON.stringify(r.errors)}`,'']}),'RT summaries use correct uninterrupted responses from 150 to 2000 ms. Cost requires at least eight usable correct trials per condition.','Device and browser timing can vary. Do not interpret these values as population norms.','This file contains no cloud connection. Delete saved copies using Saved runs, or remove exports yourself.'].join('\n')}
function saved(){const runs=safe.get(SAVE_KEY,[]);openModal('Your saved runs',runs.length?`<p>Stored only in this browser, on this device. Up to ten recent runs are kept.</p>${runs.map((s,i)=>`<div class="saved-run"><b>${esc(s.code)}</b><br>${esc(new Date(s.started).toLocaleDateString())} · ${esc(s.status)}<br><button class="btn small secondary" data-saved="${i}">Export this run</button><button class="textbtn" data-delete="${i}">Remove saved copy</button></div>`).join('')}${btn('Done','close-modal','mt')}`:`<p>No runs saved here yet. At the end of an assessment, you can choose to keep its results on this device.</p>${btn('Got it','close-modal','mt')}`)}
function handleAction(a){if(a==='home-route'){if(run){pause();return}closeModal();home()}else if(a==='settings')settings();else if(a==='close-modal')closeModal();else if(a==='about')about();else if(a==='saved')saved();else if(a==='consent')consent();else if(a==='consent-next'){if(!document.getElementById('adult').checked||!document.getElementById('consent').checked){document.getElementById('consent-error').textContent='Please confirm adult eligibility and participation, or choose Free Play.';return}session.storeChoice=document.getElementById('retain').checked;colourAccess='';setup()}else if(a==='setup')setup();else if(a==='setup-next'){const sleep=document.getElementById('sleep').value;if(!colourAccess){document.getElementById('setup-error').textContent='Choose Yes, No or Unsure for the colour check.';return}if(sleep!==''&&(!Number.isFinite(Number(sleep))||Number(sleep)<0||Number(sleep)>24)){document.getElementById('setup-error').textContent='Enter sleep hours between 0 and 24, or leave it blank.';return}session.profile={language:'English',hand:document.getElementById('hand').value,sleep:sleep===''?null:Number(sleep),colourAccess};warmupIntro()}else if(a==='warmup-start'){const task=colourAccess==='yes'?'colour':'number';startRun('warmup',task,C.warmup(session.seed,task));}else if(a==='tutorial-next'){if(!demoPassed)return;if(app.dataset.free==='true')freeStartRound();else startPractice()}else if(a==='practice-retry'){practiceAttempt=2;tutorial(currentTask())}else if(a==='practice-skip'){session.taskStatus[currentTask()]='skipped-practice';taskPos++;nextDistrict()}else if(a==='assessment-start')assessmentStart();else if(a==='district-next'){if(taskPos<session.order.length-1)stationBreak();else finishAssessment()}else if(a==='break-next'){if(performance.now()<breakEnd)return;session.rests.push({after:currentTask(),duration:Math.round(performance.now()-breakStarted),fatigue});cancelTimers();taskPos++;nextDistrict()}else if(a==='free-hub'){closeModal();freeHub()}else if(a==='free-continue'){freeRound++;freeStartRound()}else if(a==='pause')pause();else if(a==='resume')resume();else if(a==='end-run')endRun();else if(a==='assessment-exit')assessmentExit();else if(a==='download-csv')download(session.code+'-trials.csv','text/csv;charset=utf-8','\uFEFF'+C.csv(session));else if(a==='download-json')download(session.code+'.json','application/json',JSON.stringify(session,null,2));else if(a==='download-report')download(session.code+'-report.txt','text/plain;charset=utf-8',report(session))}
function click(e){const target=e.target.closest('button');if(!target||target.disabled)return;if(target.dataset.response!==undefined){if(run?.active&&(e.detail===0||!window.PointerEvent))answer(Number(target.dataset.response),'assistive-click');}else if(target.dataset.action)handleAction(target.dataset.action);else if(target.dataset.demo!==undefined)demo(Number(target.dataset.demo));else if(target.dataset.freeTask)startFree(target.dataset.freeTask);else if(target.dataset.colour){colourAccess=target.dataset.colour;app.querySelectorAll('[data-colour]').forEach(x=>x.setAttribute('aria-pressed',String(x===target)))}else if(target.dataset.fatigue){fatigue=Number(target.dataset.fatigue);app.querySelectorAll('[data-fatigue]').forEach(x=>x.setAttribute('aria-pressed',String(x===target)))}else if(target.dataset.saved!==undefined){const s=safe.get(SAVE_KEY,[])[Number(target.dataset.saved)];if(s)download(s.code+'.json','application/json',JSON.stringify(s,null,2))}else if(target.dataset.delete!==undefined){const list=safe.get(SAVE_KEY,[]);list.splice(Number(target.dataset.delete),1);if(safe.set(SAVE_KEY,list)){saved();toast('Saved copy removed.')}else toast('Could not update device storage.')}}
document.addEventListener('click',click);
document.addEventListener('pointerdown',e=>{const pad=e.target.closest('[data-response]');if(pad&&run?.active){e.preventDefault();answer(Number(pad.dataset.response),e.pointerType||'pointer')}});
document.addEventListener('keydown',e=>{if(e.repeat)return;if(modal.open){if(e.key==='Escape'&&run?.paused)e.preventDefault();return}if(e.key==='Escape'&&run){e.preventDefault();pause();return}if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(screen==='tutorial'){const task=app.dataset.task,idx=(task==='arrows'?['f','j']:['d','f','j','k']).indexOf(e.key.toLowerCase());if(idx>=0){e.preventDefault();demo(idx)}return}if(!run?.active)return;const keys=run.task==='arrows'?['f','j']:['d','f','j','k'],index=keys.indexOf(e.key.toLowerCase());if(index>=0){e.preventDefault();answer(index,'keyboard')}});
document.addEventListener('change',e=>{if(e.target.id==='pref-sound'){prefs.sound=e.target.checked;savePrefs();if(prefs.sound)sound(true)}else if(e.target.id==='pref-haptic'){prefs.haptic=e.target.checked;savePrefs()}else if(e.target.id==='pref-reduced'){prefs.reduced=e.target.checked;savePrefs()}else if(e.target.id==='adaptive')adaptive=e.target.checked;else if(e.target.id==='save-run'){session.storeChoice=e.target.checked;persistRun(session.storeChoice)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&run&&!run.paused)pause('visibility-hidden')});window.addEventListener('blur',()=>{if(run&&!run.paused)pause('window-blur')});
window.addEventListener('beforeunload',e=>{if(run||session?.status==='in-progress'&&screen!=='home'&&screen!=='free-hub'){e.preventDefault();e.returnValue=''}});

// Everything below is original canvas artwork. No images, fonts or libraries are fetched.
function mountArt(id,type){const canvas=document.getElementById(id);if(!canvas)return;art={canvas,type,w:0,h:0};const loop=now=>{if(!art||art.canvas!==canvas||!canvas.isConnected)return;const rect=canvas.getBoundingClientRect(),w=Math.max(1,rect.width),h=Math.max(1,rect.height),dpr=Math.min(window.devicePixelRatio||1,2);if(art.w!==w||art.h!==h){canvas.width=w*dpr;canvas.height=h*dpr;art.w=w;art.h=h}const delta=lastPaint?Math.min(50,now-lastPaint):16;lastPaint=now;if(run&&!run.paused&&!prefs.reduced)sceneTime+=delta;const g=canvas.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);if(type==='hero')drawHero(g,w,h);else drawWorld(g,w,h,type,now);if(run?.active){const bar=document.getElementById('deadline');if(bar)bar.style.transform=`scaleX(${Math.max(0,1-(performance.now()-run.onset)/run.deadline)})`}artFrame=requestAnimationFrame(loop)};cancelAnimationFrame(artFrame);loop(performance.now())}
function rounded(g,x,y,w,h,r,fill,stroke=null,width=1){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=width;g.stroke()}}
function path(g,pts,fill,stroke=null,width=1){g.beginPath();g.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)g.lineTo(...pts[i]);g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=width;g.stroke()}}
function ellipse(g,x,y,rx,ry,fill){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=fill;g.fill()}
function segment(g,x,y,x2,y2,c,lw=1){g.strokeStyle=c;g.lineWidth=lw;g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}
function drawRunner(g,x,y,scale=1,pose=0,cycle=null){
const moving=cycle!==null,s=moving?Math.sin(cycle):0,c=moving?Math.cos(cycle):0,bob=moving?-Math.abs(c)*3:0;
g.save();g.translate(x,y+bob);g.scale(scale,scale);ellipse(g,0,47-bob,23-Math.abs(s)*2,5,'#182e322b');g.lineCap='round';
function leg(side,phase){const swing=moving?Math.sin(phase):side*.16,kick=moving?Math.max(0,Math.cos(phase)):0,hip=side*7,knee=hip+swing*9,foot=hip+swing*16;
segment(g,hip,23,knee,35-kick*4,'#1d3940',8);segment(g,knee,35-kick*4,foot,46-kick*17,'#213e43',7);g.save();g.translate(foot,45-kick*17);g.rotate(moving?swing*.23:0);rounded(g,-9,-3,18,8,3,'#fffcf2','#213e43',1.5);rounded(g,-8,2,17,3,1,'#c1d4bb');g.restore()}
leg(-1,cycle||0);leg(1,(cycle||0)+Math.PI);
g.save();g.rotate(moving?s*.025:0);
rounded(g,-18,-1,34,31,10,'#185e55','#182e32',2);
const armSwing=moving?s*10:pose*4;
segment(g,-13,4,-20,15-armSwing*.6,'#182e32',8);segment(g,-20,15-armSwing*.6,-17,25-armSwing,'#ad704c',6);
segment(g,12,4,20,15+armSwing*.6,'#182e32',8);segment(g,20,15+armSwing*.6,17,25+armSwing,'#ad704c',6);
rounded(g,-13,-3,27,31,8,'#ec713d','#182e32',1.6);rounded(g,-9,1,19,18,5,'#f18b4f','#a94424',1);rounded(g,-8,13,17,8,3,'#cc542d');segment(g,-4,4,-4,17,'#f8bd69',2);rounded(g,-8,-20,17,22,7,'#ad704c','#182e32',1);rounded(g,-10,-24,22,10,5,'#213e43');rounded(g,-14,-25,25,7,3,'#226e5d','#182e32',1.3);rounded(g,5,-21,12,4,2,'#226e5d','#182e32',1);g.restore();g.restore();
}


function drawTree(g,x,y,s=1,muted=false){g.save();g.translate(x,y);g.scale(s,s);rounded(g,-3,-12,6,24,2,'#938d78');ellipse(g,0,-22,18,24,muted?'#b6c4af':'#8aaf75');ellipse(g,-9,-17,12,17,muted?'#c3cebb':'#a3be83');g.restore()}
function drawHero(g,w,h){const sx=w/440,sy=h/270;g.save();g.scale(sx,sy);ellipse(g,214,237,189,18,'#d9dfcb');path(g,[[70,211],[280,128],[400,189],[202,261]],'#d1d8bf','#b5c1a5');path(g,[[110,212],[278,145],[352,182],[190,247]],'#eee4cb');for(let i=0;i<8;i++){const x=135+i*22;segment(g,x,215-i*7,x+53,237-i*7,'#a8af9b',2)}segment(g,116,213,280,150,'#526d60',3);segment(g,189,246,352,184,'#526d60',3);drawTree(g,69,203,.9);drawTree(g,362,160,.8);drawTree(g,397,193,.6);rounded(g,100,88,145,112,14,'#eedfc4','#182e32',2);rounded(g,93,80,159,19,6,'#176c59','#182e32',2);for(let i=0;i<4;i++)rounded(g,112+i*31,115,23,36,5,['#c53747','#247c55','#3265c5','#d5a52d'][i],'#182e32',1.5);rounded(g,141,161,57,39,9,'#fff9e9','#182e32',2);segment(g,169,162,169,199,'#d6cdb8',2);rounded(g,256,119,112,83,15,'#ec713d','#182e32',2);rounded(g,266,131,91,34,8,'#d5e6d5','#182e32',2);segment(g,296,131,296,165,'#182e32',2);segment(g,326,131,326,165,'#182e32',2);rounded(g,278,173,53,22,6,'#f8bd69','#182e32',1.5);ellipse(g,277,204,10,10,'#182e32');ellipse(g,346,204,10,10,'#182e32');ellipse(g,277,204,4,4,'#d1d8bf');ellipse(g,346,204,4,4,'#d1d8bf');drawRunner(g,216,208,.87,0);g.save();g.translate(38,161);g.rotate(-.16);rounded(g,0,0,53,35,6,'#f8bd69','#182e32',1.5);g.fillStyle='#182e32';g.font='bold 11px system-ui';g.fillText('RUSH',8,22);segment(g,39,4,39,31,'#182e32',1);g.restore();g.restore()}
function gateDepth(now){if(!run||!run.current)return .07;if(run.phase==='feedback')return run.exitDepth+(1.2-run.exitDepth)*Math.min(1,(now-feedbackStart)/300);if(run.phase==='stimulus')return .23+.58*Math.min(1,(now-run.onset)/run.deadline);if(run.phase==='gap')return .07+.16*Math.min(1,(now-run.gateBorn)/(run.current?.jitter||650));return run.frozenDepth||.2}

function drawWorld(g,w,h,task,now){
const motion=!prefs.reduced&&run&&!run.paused,clock=sceneTime,rush=clock*.001,cycle=motion?clock*.022:null;
const palette=task==='arrows'?['#dfe8e7','#afc4bc','#cedcd1']:task==='number'?['#efe6d3','#d4c6ac','#e4d8bb']:['#e8ecdb','#b7cbb0','#d7e1c5'];
g.fillStyle=palette[0];g.fillRect(0,0,w,h);const horizon=Math.max(107,h*.36),roadH=h-horizon,centre=w*.5;
ellipse(g,w*.81,horizon*.30,24,24,'#fff5cd');
for(const [x,y,s] of [[w*.18,horizon*.21,1],[w*.67,horizon*.13,.7]]){ellipse(g,x,y,22*s,6*s,'#f9fbf2');ellipse(g,x-8*s,y-4*s,9*s,7*s,'#f9fbf2')}
for(let i=0;i<8;i++){const x=i*w/7-15,hh=25+(i*17%39);rounded(g,x,horizon-hh,w/8,hh,4,palette[1]);for(let j=0;j<2;j++)rounded(g,x+7+j*13,horizon-hh+9,6,10,1,'#eaf0e3')}
g.fillStyle=palette[2];g.fillRect(0,horizon,w,roadH);
path(g,[[w*.39,horizon],[w*.61,horizon],[w*1.13,h],[w*-.13,h]],'#a8bca0');
path(g,[[w*.405,horizon],[w*.595,horizon],[w*1.02,h],[w*-.02,h]],'#d7ddc9');
path(g,[[w*.413,horizon],[w*.587,horizon],[w*.95,h],[w*.05,h]],'#e8eadb');
const n=task==='arrows'?2:4;
for(let i=0;i<=n;i++){const start=w*(.413+.174*i/n),end=w*(.05+.90*i/n);segment(g,start,horizon,end,h,'#91a689',1.4);if(i===0||i===n)segment(g,start+2,horizon,end+2,h,'#f7f8e9',1)}
// Perspective sleepers move at a constant sprinting pace, independently of decisions.
for(let i=0;i<17;i++){let t=(i/17+(prefs.reduced?0:rush*.78))%1;const z=t*t,y=horizon+roadH*z;segment(g,w*(.413-.363*z),y,w*(.587+.363*z),y,'#b1c1a5',.7+3*z)}
// Trees, posts and roadside stalls grow and pass the camera.
for(let i=0;i<5;i++){const t=(i/5+(prefs.reduced?0:rush*.19))%1,z=t*t,y=horizon+roadH*z,spread=w*(.14+.52*z),sz=.14+z*1.55;
if(task==='number'&&i%2===0){for(const side of [-1,1]){const x=centre+side*spread;rounded(g,x-18*sz,y-30*sz,36*sz,36*sz,3*sz,'#c3b798','#63725d',.8);path(g,[[x-22*sz,y-29*sz],[x+22*sz,y-29*sz],[x+16*sz,y-43*sz],[x-16*sz,y-43*sz]],'#a8b988')}}
else{drawTree(g,centre-spread,y,sz,true);drawTree(g,centre+spread,y,sz,true)}
for(const side of [-1,1]){const x=centre+side*w*(.115+.43*z);segment(g,x,y-19*sz,x,y+4*sz,'#657b65',2*sz);rounded(g,x-5*sz,y-24*sz,10*sz,8*sz,2*sz,'#edf1df','#71836a',.7)}}
if(motion){for(let i=0;i<6;i++){const t=(i/6+rush*.48)%1,z=t*t,x=w*(i%2===0?.025:.975),y=horizon+roadH*z;segment(g,x,y,x+(i%2===0?-1:1)*(5+9*z),y+12+35*z,'#ffffff85',1+z)}}
const depth=gateDepth(now);
function gates(z,alpha=1){if(z<0||z>1.25)return;const zz=z*z,baseY=horizon+(roadH+80)*zz,span=w*(.18+.94*zz),fullH=Math.min(145,h*.24)*(.16+1.08*z),gap=3+7*z,gw=(span-(n-1)*gap)/n,left=centre-span/2,frame=Math.max(2,gw*.10);
g.save();g.globalAlpha=alpha;for(let i=0;i<n;i++){const x=left+i*(gw+gap),top=baseY-fullH,fc=task==='colour'?COLOURS[i].hex:task==='arrows'?'#758e74':'#769576',r=Math.max(3,gw*.20),extrude=2+5*z;
path(g,[[x+gw,top+8],[x+gw+extrude,top+extrude+8],[x+gw+extrude,baseY+extrude],[x+gw,baseY]],task==='colour'?fc:'#4f6f58');
rounded(g,x,top,gw,fullH,r,fc,'#213d3b',.5+1.3*z);
const shade=g.createLinearGradient(0,top,0,baseY);shade.addColorStop(0,'#203c3d90');shade.addColorStop(1,'#203c3d05');rounded(g,x+frame,top+frame*1.5,Math.max(1,gw-2*frame),Math.max(1,fullH-frame*1.5),Math.max(2,r-frame),shade);
rounded(g,x+frame*.6,top+frame*.5,Math.max(1,gw-frame*1.2),Math.max(2,frame*.5),2,'#ffffff4a');
if(task==='number'&&gw>18){const labelH=Math.max(10,fullH*.29);rounded(g,x+frame,top+frame,gw-2*frame,labelH,2,'#fffdf1');g.fillStyle='#182e32';g.font=`900 ${Math.max(8,labelH*.80)}px system-ui`;g.textAlign='center';g.fillText(String(i+1),x+gw/2,top+frame+labelH*.82)}
}g.restore()}
// The next set is already on the horizon before the current set rushes past.
gates(.045,.45);gates(depth);
const dest=visualLane===null?centre:w*(.05+(visualLane+.5)*.90/n),f=run?.phase==='feedback'?Math.min(1,(now-feedbackStart)/210):0,ease=1-Math.pow(1-f,3),x=run?.phase==='feedback'?centre+(dest-centre)*ease:centre,scale=Math.min(w/340,1.15),y=h-54*scale;
drawRunner(g,x,y,scale,0,cycle);
if(run?.phase==='feedback'&&flash==='correct'&&!prefs.reduced){for(let i=0;i<6;i++){const a=i*1.05+f*2.0,r=12+f*42;g.globalAlpha=1-f*.7;rounded(g,x+Math.cos(a)*r,y-40+Math.sin(a)*r*.65,5,5,1,'#e1ae38')}g.globalAlpha=1}
if(run?.phase==='feedback'&&flash==='wrong'){g.fillStyle='#c537470c';g.fillRect(0,0,w,h)}
}

home();
})();
</script>
